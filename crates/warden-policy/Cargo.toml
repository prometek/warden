[package]
name = "warden-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Declarative policy engine (issue #51, ADR-0016): rules/evaluator/Decision -- the upstream decision layer that informs the orchestrator which agent actions are allowed, denied, or require human approval. Never the final enforcement barrier on `git push origin`; that stays warden-gated's job (ADR-0002/0006), unchanged."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2"
