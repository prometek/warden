name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # crates/*/.sqlx caches are committed — no live database needed to build/test.
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: fmt, clippy, build, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Require Docker tests on Linux
        if: runner.os == 'Linux'
        run: |
          docker info
          docker pull alpine:latest

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --workspace

      - name: cargo test
        run: cargo test --workspace

  cargo-deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Reads deny.toml at the repo root (issue #69) — licenses, RustSec
      # advisories, banned/duplicate deps, allowed dependency sources.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  gitleaks:
    name: gitleaks (scan PR diff)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history for diff range)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "${checksum}" /tmp/gitleaks.tar.gz > /tmp/gitleaks.sha256
          sha256sum --check /tmp/gitleaks.sha256
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans only the commits introduced by this PR (base..head), same
      # config as the local pre-commit hook (.gitleaks.toml) — issue #69.
      - name: gitleaks detect (PR diff)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --verbose
